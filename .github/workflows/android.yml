name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build the release APK and app bundle instead of the debug APK'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && !inputs.build_release
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frostlock-remote-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release APK and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      FROSTLOCK_RELEASE_STORE_PASSWORD: ${{ secrets.FROSTLOCK_RELEASE_STORE_PASSWORD }}
      FROSTLOCK_RELEASE_KEY_ALIAS: ${{ secrets.FROSTLOCK_RELEASE_KEY_ALIAS }}
      FROSTLOCK_RELEASE_KEY_PASSWORD: ${{ secrets.FROSTLOCK_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          FROSTLOCK_RELEASE_KEYSTORE_BASE64: ${{ secrets.FROSTLOCK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FROSTLOCK_RELEASE_KEYSTORE_BASE64"
          test -n "$FROSTLOCK_RELEASE_STORE_PASSWORD"
          test -n "$FROSTLOCK_RELEASE_KEY_ALIAS"
          test -n "$FROSTLOCK_RELEASE_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/frostlock-release.jks"
          printf '%s' "$FROSTLOCK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "FROSTLOCK_RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK and app bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: frostlock-remote-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release app bundle
        uses: actions/upload-artifact@v4
        with:
          name: frostlock-remote-aab-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
